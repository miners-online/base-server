name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh index
        run: packwiz refresh

      - name: Export .mrpack
        run: packwiz modrinth export

      - name: Read pack version
        run: |
          VERSION=$(grep -m1 '^version' pack.toml | cut -d'"' -f2)
          if [ -z "$VERSION" ]; then
            echo "No version found in pack.toml" >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Zip packwiz pack
        run: |
          zip -r "base-server-packwiz-${VERSION}.zip" . \
            -x ".git/*" ".github/*" "*.mrpack" "*.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.mrpack
            base-server-packwiz-*.zip
